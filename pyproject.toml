[project]
name = "ox-alpha-ait-hackathon-2026"
version = "0.1.0"
description = "Compliance agents data layer: legislation as structured markdown, knowledge bases, benchmarks"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "html2text>=2024.4.16",
    "networkx>=3.6.1",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.0",
    "pyvis>=0.3.2",
    "scikit-learn>=1.9.1",
]
